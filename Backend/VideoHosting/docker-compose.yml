version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: videohosting-postgres
    environment:
      POSTGRES_DB: videohosting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videohosting-network

  minio:
    image: minio/minio:latest
    container_name: videohosting-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - videohosting-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: videohosting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - videohosting-network

  api:
    build:
      context: .
      dockerfile: VideoHosting.Api/Dockerfile
    container_name: videohosting-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Container
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videohosting;Username=postgres;Password=postgres;
      - Minio__Endpoint=http://minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - RabbitMQ__ConnectionString=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - minio
      - rabbitmq
    networks:
      - videohosting-network

  worker:
    build:
      context: .
      dockerfile: VideoHosting.Worker/Dockerfile
    container_name: videohosting-worker
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videohosting;Username=postgres;Password=postgres;
      - Minio__Endpoint=http://minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - RabbitMQ__ConnectionString=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - minio
      - rabbitmq
    networks:
      - videohosting-network

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:

networks:
  videohosting-network:
    driver: bridge