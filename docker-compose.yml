version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: videohosting-postgres
    environment:
      POSTGRES_DB: videohosting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videohosting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO для хранения видео файлов
  minio:
    image: minio/minio:latest
    container_name: videohosting-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - videohosting-network

  # RabbitMQ для обработки сообщений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: videohosting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - videohosting-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Основной API сервис
  api:
    build:
      context: ./Backend/Videohosting
      dockerfile: VideoHosting.Api/Dockerfile
    container_name: videohosting-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Container
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videohosting;Username=postgres;Password=postgres;
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__Port=5672
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - videohosting-network

  # Worker сервис для обработки видео
  worker:
    build:
      context: ./Backend/Videohosting
      dockerfile: VideoHosting.Worker/Dockerfile
    container_name: videohosting-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Container
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videohosting;Username=postgres;Password=postgres;
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__Port=5672
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - videohosting-network

  # Фронтенд сервис
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ztube-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://api:8080/api
    depends_on:
      - api
    networks:
      - videohosting-network

  # Nginx как reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ztube-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api
    networks:
      - videohosting-network

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:

networks:
  videohosting-network:
    driver: bridge