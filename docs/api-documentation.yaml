openapi: 3.0.0
info:
  title: ZTube API
  description: API видеоплатформы ZTube
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Локальный сервер разработки
  - url: https://api.ztube.example.com/api
    description: Production сервер
paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - name
                - email
                - password
      responses:
        '200':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
        '500':
          description: Внутренняя ошибка сервера
  /auth/login:
    post:
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
        '500':
          description: Внутренняя ошибка сервера
  /auth/me:
    get:
      summary: Получение информации о текущем пользователе
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный доступ
        '500':
          description: Внутренняя ошибка сервера
  /users/profile:
    get:
      summary: Получение профиля текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный доступ
        '404':
          description: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера
    put:
      summary: Обновление профиля пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный доступ
        '403':
          description: Нет прав на обновление профиля другого пользователя
        '500':
          description: Внутренняя ошибка сервера
  /users/{channelId}/subscribe:
    post:
      summary: Подписка на канал
      security:
        - bearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешная подписка
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '400':
          description: Нельзя подписаться на самого себя
        '401':
          description: Неавторизованный доступ
        '500':
          description: Внутренняя ошибка сервера
  /users/{channelId}/unsubscribe:
    post:
      summary: Отписка от канала
      security:
        - bearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешная отписка
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '500':
          description: Внутренняя ошибка сервера
  /users/{channelId}/is-subscribed:
    get:
      summary: Проверка подписки на канал
      security:
        - bearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Результат проверки подписки
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '500':
          description: Внутренняя ошибка сервера
  /users/{channelId}/subscriber-count:
    get:
      summary: Получение количества подписчиков канала
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Количество подписчиков
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: integer
        '500':
          description: Внутренняя ошибка сервера
  /videos:
    get:
      summary: Получение списка видео
      parameters:
        - name: searchTerm
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [title, createdAt, views, likes]
            default: createdAt
        - name: sortDescending
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Список видео
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Video'
        '500':
          description: Внутренняя ошибка сервера
    post:
      summary: Загрузка нового видео
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                videoFile:
                  type: string
                  format: binary
                thumbnailFile:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Видео успешно загружено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Video'
        '401':
          description: Неавторизованный доступ
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}:
    get:
      summary: Получение информации о видео
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Информация о видео
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Video'
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
    put:
      summary: Обновление информации о видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Video'
      responses:
        '200':
          description: Видео успешно обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Video'
        '401':
          description: Неавторизованный доступ
        '403':
          description: Нет прав на редактирование видео другого пользователя
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
    delete:
      summary: Удаление видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Видео успешно удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '403':
          description: Нет прав на удаление видео другого пользователя
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}/view:
    post:
      summary: Увеличение счетчика просмотров
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Счетчик просмотров увеличен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}/like:
    post:
      summary: Лайк видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Лайк успешно поставлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}/dislike:
    post:
      summary: Дизлайк видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Дизлайк успешно поставлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}/reaction:
    delete:
      summary: Удаление реакции пользователя на видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Реакция удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '401':
          description: Неавторизованный доступ
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
    get:
      summary: Получение реакции текущего пользователя на видео
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Реакция получена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VideoReaction'
        '401':
          description: Неавторизованный доступ
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /videos/{videoId}/processing-status:
    get:
      summary: Получение статуса обработки видео
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статус обработки видео
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VideoProcessingStatus'
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
  /admin/users:
    get:
      summary: Получение списка пользователей (админ)
      security:
        - bearerAuth: []
      parameters:
        - name: searchTerm
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный доступ
        '403':
          description: Недостаточно прав
        '500':
          description: Внутренняя ошибка сервера
  /admin/videos/{videoId}:
    delete:
      summary: Удаление видео пользователем (админ)
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
      responses:
        '200':
          description: Видео успешно удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: boolean
        '400':
          description: Некорректные данные
        '401':
          description: Неавторизованный доступ
        '403':
          description: Недостаточно прав
        '404':
          description: Видео не найдено
        '500':
          description: Внутренняя ошибка сервера
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Video:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        originalVideoUrl:
          type: string
        processedVideoUrl:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [Processing, Completed, Failed]
        views:
          type: integer
        likes:
          type: integer
        dislikes:
          type: integer
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    VideoReaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        videoId:
          type: string
          format: uuid
        reactionType:
          type: string
          enum: [Like, Dislike]
        createdAt:
          type: string
          format: date-time
    VideoProcessingStatus:
      type: object
      properties:
        status:
          type: string
          enum: [Processing, Completed, Failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resolutions:
          type: array
          items:
            type: string
        errorMessage:
          type: string
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT